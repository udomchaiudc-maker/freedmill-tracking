
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FREEDMILL STAFF</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f4f7;color:#243447;font-family:Arial,sans-serif}
header{background:#173b5e;color:white;padding:20px;text-align:center}
main{max-width:850px;margin:24px auto;padding:15px}
.card{background:white;border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 2px 12px #0000000c}
h2{font-size:19px;color:#173b5e;margin-top:0}
input,select{width:100%;padding:11px;border:1px solid #ccd3dc;border-radius:7px;font-size:15px;margin:6px 0 14px}
label{font-size:14px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
button{border:0;border-radius:8px;padding:13px 20px;background:#173b5e;color:white;font-size:15px;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#687789}
#message{margin:12px 0;white-space:pre-wrap}
#app{display:none}
#label{display:none}
#qrcode{margin:15px auto;width:150px}
.labelbox{background:white;color:#111;padding:20px;border:1px solid #aaa;max-width:700px;margin:auto}
.labelbox h2{text-align:center;color:#111}
.labelrow{padding:7px 0;border-bottom:1px solid #ddd}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
}

@media print{
  body{background:white}
  body *{visibility:hidden}
  #label,#label *{visibility:visible}
  #label{display:block!important;position:absolute;left:0;top:0;width:100%}
  .labelbox{border:0;max-width:none}
}
</style>
</head>

<body>

<header>
<h1>FREEDMILL TRACKING</h1>
<div>STAFF MANAGEMENT</div>
</header>

<main>

<!-- LOGIN -->
<section class="card" id="login">
<h2>เข้าสู่ระบบพนักงาน</h2>

<label>อีเมล</label>
<input id="email" type="email" placeholder="Staff email">

<label>รหัสผ่าน</label>
<input id="password" type="password" placeholder="Password">

<button id="loginBtn" onclick="loginStaff()">เข้าสู่ระบบ</button>

<div id="loginMsg"></div>
</section>

<!-- STAFF APP -->
<section id="app">

<div class="card">
<h2>สร้างรายการจัดส่งใหม่</h2>

<form id="shipmentForm">

<div class="grid">

<div>
<label>เลขที่เอกสาร</label>
<input name="invoice_no" required>
</div>

<div>
<label>ผู้ส่ง</label>
<input name="shipper" required>
</div>

<div>
<label>ผู้รับ</label>
<input name="consignee" required>
</div>

<div>
<label>กำหนดส่ง (ETA)</label>
<input name="eta" placeholder="เช่น 30/10/2026">
</div>

<div>
<label>เลขที่หีบห่อ</label>
<input name="pkg_no">
</div>

<div>
<label>เลขที่รายการ</label>
<input name="list_no">
</div>

<div>
<label>รหัสสินค้า</label>
<input name="product_code">
</div>

<div>
<label>แบรนด์</label>
<input name="brand">
</div>

<div>
<label>สี</label>
<input name="color">
</div>

<div>
<label>จำนวนสินค้า</label>
<input name="qty">
</div>

<div>
<label>จำนวนหีบห่อ</label>
<input name="line_pkg">
</div>

<div>
<label>น้ำหนักสุทธิ (NW)</label>
<input name="nw" type="number" step="any">
</div>

<div>
<label>น้ำหนักรวม (GW)</label>
<input name="gw" type="number" step="any">
</div>

<div>
<label>สถานที่ปลายทาง (POD)</label>
<input name="pod">
</div>

<div>
<label>เลขตู้สินค้า</label>
<input name="container_no">
</div>

<div>
<label>เลขซีล</label>
<input name="seal_no">
</div>

</div>

<label>รายละเอียดสินค้า</label>
<input name="description" required>

<label>สถานะเริ่มต้น</label>
<select name="status">
<option value="เตรียมจัดส่ง">เตรียมจัดส่ง</option>
<option value="กำลังจัดส่ง">กำลังจัดส่ง</option>
</select>

<label>สถานที่เริ่มต้น</label>
<input name="event_place" placeholder="เช่น อุดมชัยกู๊ดโฮม สมุทรสงคราม">

<button id="saveBtn" type="submit">บันทึกรายการและสร้าง QR</button>

</form>

<div id="message"></div>
</div>

<!-- SHIPPING LABEL -->
<section class="card" id="label">

<div class="labelbox">

<h2>FREEDMILL TRACKING</h2>

<div class="labelrow"><b>INVOICE NO.:</b> <span id="l_invoice"></span></div>
<div class="labelrow"><b>SHIPPER:</b> <span id="l_shipper"></span></div>
<div class="labelrow"><b>CONSIGNEE:</b> <span id="l_consignee"></span></div>
<div class="labelrow"><b>DESTINATION:</b> <span id="l_pod"></span></div>
<div class="labelrow"><b>PACKAGE NO.:</b> <span id="l_pkg"></span></div>
<div class="labelrow"><b>LIST NO.:</b> <span id="l_list"></span></div>
<div class="labelrow"><b>DESCRIPTION:</b> <span id="l_description"></span></div>
<div class="labelrow"><b>PRODUCT CODE:</b> <span id="l_product"></span></div>
<div class="labelrow"><b>BRAND / COLOR:</b> <span id="l_brand"></span> / <span id="l_color"></span></div>
<div class="labelrow"><b>QTY:</b> <span id="l_qty"></span> &nbsp; <b>PACKAGE:</b> <span id="l_line"></span></div>
<div class="labelrow"><b>NW:</b> <span id="l_nw"></span> &nbsp; <b>GW:</b> <span id="l_gw"></span></div>

<div id="qrcode"></div>

<p style="text-align:center">SCAN QR CODE TO TRACK SHIPMENT</p>

<div style="text-align:center;font-size:12px" id="l_code"></div>

</div>

<div style="text-align:center;margin-top:15px">
<button onclick="window.print()">พิมพ์ใบปะหน้า</button>
</div>

</section>

<button class="secondary" onclick="logoutStaff()">ออกจากระบบ</button>

</section>

</main>

<script>

// CONNECT SUPABASE
const db = window.supabase.createClient(APP.url, APP.key);


// LOGIN
async function loginStaff(){

  const msg = document.getElementById('loginMsg');
  const btn = document.getElementById('loginBtn');

  btn.disabled = true;
  msg.textContent = 'กำลังเข้าสู่ระบบ...';

  try {

    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    });

    if(error) throw error;

    await showApp();

  } catch(error) {

    msg.textContent = 'เข้าสู่ระบบไม่สำเร็จ: ' + error.message;

  } finally {

    btn.disabled = false;

  }
}


// SHOW STAFF APP
async function showApp(){

  const { data, error } = await db.auth.getSession();

  if(error){
    document.getElementById('loginMsg').textContent = error.message;
    return;
  }

  if(!data.session) return;

  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';

}


// LOGOUT
async function logoutStaff(){

  await db.auth.signOut();
  location.reload();

}


// LABEL TEXT
function setLabel(id,value){

  document.getElementById(id).textContent = value || '-';

}


// SAVE SHIPMENT
document.getElementById('shipmentForm').addEventListener('submit',async function(e){

  e.preventDefault();

  const btn = document.getElementById('saveBtn');
  const msg = document.getElementById('message');

  btn.disabled = true;
  msg.textContent = 'กำลังบันทึกข้อมูล...';

  let shipmentSaved = false;

  try {

    const f = new FormData(this);
    const v = name => (f.get(name) || '').trim();

    const record = {

      invoice_no: v('invoice_no'),
      status: v('status'),
      step: 1,
      eta: v('eta') || null,
      shipper: v('shipper'),
      consignee: v('consignee'),
      pod: v('pod') || null,
      pkg_no: v('pkg_no') || null,
      list_no: v('list_no') || null,
      description: v('description'),
      product_code: v('product_code') || null,
      brand: v('brand') || null,
      color: v('color') || null,
      qty: v('qty') || null,
      line_pkg: v('line_pkg') || null,
      nw: v('nw') ? Number(v('nw')) : null,
      gw: v('gw') ? Number(v('gw')) : null,
      container_no: v('container_no') || null,
      seal_no: v('seal_no') || null

    };


    // SUPABASE GENERATES ID AND PUBLIC CODE
    const { data, error } = await db
      .from('shipments')
      .insert(record)
      .select('id, public_code')
      .single();

    if(error) throw error;

    shipmentSaved = true;

    const code = data.public_code;

    if(!code){
      throw new Error('ไม่พบรหัส public_code ที่ Supabase สร้างให้');
    }


    // SAVE FIRST TRACKING EVENT
    const place = v('event_place') || 'ไม่ระบุสถานที่';

    const { error: eventError } = await db
      .from('shipment_events')
      .insert({
        shipment_id: data.id,
        title: 'สร้างรายการจัดส่ง',
        place: place
      });

    if(eventError){
      throw new Error('บันทึกรายการแล้ว แต่ประวัติไม่สำเร็จ: ' + eventError.message);
    }


    // CREATE TRACKING URL
    const url = new URL(APP.base);
    url.searchParams.set('t', code);


    // FILL SHIPPING LABEL
    const fields = {

      l_invoice: v('invoice_no'),
      l_shipper: v('shipper'),
      l_consignee: v('consignee'),
      l_pod: v('pod'),
      l_pkg: v('pkg_no'),
      l_list: v('list_no'),
      l_description: v('description'),
      l_product: v('product_code'),
      l_brand: v('brand'),
      l_color: v('color'),
      l_qty: v('qty'),
      l_line: v('line_pkg'),
      l_nw: v('nw'),
      l_gw: v('gw'),
      l_code: code

    };

    Object.entries(fields).forEach(([id,value]) => {
      setLabel(id,value);
    });


    // GENERATE QR CODE
    document.getElementById('qrcode').innerHTML = '';

    new QRCode(document.getElementById('qrcode'), {
      text: url.toString(),
      width: 150,
      height: 150
    });


    document.getElementById('label').style.display = 'block';

    msg.textContent = 'บันทึกสำเร็จ! สร้าง QR Code เรียบร้อยแล้ว';

    document.getElementById('label').scrollIntoView({
      behavior: 'smooth'
    });

    this.reset();

  } catch(error) {

    msg.textContent = shipmentSaved
      ? 'บันทึกรายการแล้ว แต่ขั้นตอนต่อไปมีปัญหา: ' + error.message
      : 'เกิดข้อผิดพลาด: ' + error.message;

  } finally {

    btn.disabled = false;

  }

});


// CHECK EXISTING LOGIN SESSION
showApp();

</script>

</body>
</html>
